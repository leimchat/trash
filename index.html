<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Битва треков · Twitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--void:#0b0818;--g1:rgba(19,13,42,.92);--g2:rgba(7,5,16,.86);--hair:rgba(255,255,255,.08);--v:124,92,255;--pk:224,95,184;--cy:63,184,201;--soft:#c9b8ff;--ink:#f6f2ff;--dim:#9086b8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(900px 500px at 15% -10%,rgba(124,92,255,.28),transparent 60%),radial-gradient(800px 500px at 100% 110%,rgba(224,95,184,.18),transparent 60%),var(--void);color:var(--ink);font-family:Manrope,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%);pointer-events:none;z-index:0}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg i{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.5;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){background:#7c5cff;left:-120px;top:-120px}.bg i:nth-child(2){background:#e05fb8;right:-150px;bottom:-150px;animation-delay:-6s}.bg i:nth-child(3){background:#3fb8c9;left:45%;top:40%;width:340px;height:340px;opacity:.22;animation-delay:-11s}
@keyframes fl{to{transform:translate(90px,70px) scale(1.25)}}
.bg b{position:absolute;bottom:-20px;border-radius:50%;background:#fff;opacity:0;animation:rise linear infinite}
@keyframes rise{10%{opacity:.7}100%{transform:translateY(-112vh) translateX(40px);opacity:0}}
.glass{background:linear-gradient(155deg,var(--g1),var(--g2));border:1px solid var(--hair);border-radius:20px;backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px -30px rgba(0,0,0,.8)}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;letter-spacing:-.5px}
.grad{background:linear-gradient(100deg,#fff 8%,var(--soft) 125%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
button,input{font:inherit;color:inherit}
.btn{border:0;cursor:pointer;font-weight:800;border-radius:12px;padding:13px 22px;background:linear-gradient(135deg,#7c5cff,#b565d8);box-shadow:0 8px 28px -8px rgba(124,92,255,.9);transition:.2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.ghost{background:rgba(255,255,255,.06);box-shadow:none;border:1px solid var(--hair);padding:9px 14px;font-size:13px}
.btn.pk{background:linear-gradient(135deg,#e05fb8,#b565d8);box-shadow:0 8px 28px -8px rgba(224,95,184,.9)}
input{background:rgba(8,9,20,.6);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;outline:0;width:100%;min-width:0;transition:.2s}
input:focus{border-color:rgba(var(--v),.7);box-shadow:0 0 0 3px rgba(var(--v),.2)}
label{display:block;text-align:left;font-size:11px;color:var(--dim);font-weight:700;margin:16px 0 7px;letter-spacing:.6px;text-transform:uppercase}
code{font-family:'JetBrains Mono',monospace;color:var(--soft);background:rgba(var(--v),.16);border-radius:8px;padding:2px 8px;font-size:.92em}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(var(--v),.5);border-radius:6px}
#start,#app{position:relative;z-index:1}
#start{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#start .box{width:min(480px,100%);padding:44px 38px;text-align:center;border:1px solid transparent;border-radius:24px;background:linear-gradient(155deg,rgba(19,13,42,.95),rgba(7,5,16,.92)) padding-box,conic-gradient(from var(--a,0deg),#7c5cff,#e05fb8,#3fb8c9,#7c5cff) border-box;animation:spinb 6s linear infinite;box-shadow:0 0 80px -20px rgba(124,92,255,.7)}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spinb{to{--a:360deg}}
.logo{width:132px;height:132px;margin:0 auto 18px;border-radius:30px;overflow:hidden;border:2px solid rgba(var(--v),.7);box-shadow:0 14px 50px -6px rgba(124,92,255,.95),0 0 0 6px rgba(var(--v),.12);animation:bob 3s ease-in-out infinite}
.lg{display:block;width:100%;height:100%;object-fit:cover}
.hl{width:46px;height:46px;border-radius:14px;border:1px solid rgba(var(--v),.7);box-shadow:0 6px 24px -6px rgba(124,92,255,.9)}
@keyframes bob{50%{transform:translateY(-7px) rotate(-4deg)}}
#start h1{font-size:46px;text-shadow:0 0 40px rgba(124,92,255,.5)}#start p{color:var(--dim);font-size:14px;margin:6px 0 22px;line-height:1.5}
.tw{display:flex;gap:6px;align-items:center;background:rgba(8,9,20,.6);border:1px solid var(--hair);border-radius:14px;padding:4px 6px 4px 16px;transition:.2s}
.tw:focus-within{border-color:rgba(var(--v),.8);box-shadow:0 0 0 4px rgba(var(--v),.2)}
.tw span{font-weight:800;color:var(--soft);font-size:18px;white-space:nowrap}
.tw input{border:0;background:transparent;box-shadow:none!important;font-size:18px;font-weight:700;padding-left:4px}
.row2{display:flex;gap:10px;margin-top:20px}
#st{min-height:18px;font-size:12px;color:#ff8aa8;margin-top:10px}
#app{display:none;max-width:1840px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}
header h1{font-size:30px}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(8,9,20,.55);border:1px solid var(--hair);border-radius:100px;padding:7px 14px;font-size:12px;font-weight:700}
#dot{width:8px;height:8px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 8px #ff4d4d}#dot.live{background:#59e9ff;box-shadow:0 0 8px #59e9ff,0 0 16px #59e9ff;animation:p 1.4s infinite}#dot.demo{background:#ffd84a;box-shadow:0 0 8px #ffd84a}
@keyframes p{50%{opacity:.35}}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.grid>div{min-width:0}
.grid.wide{grid-template-columns:minmax(0,1fr)}.grid.wide #side{position:static;max-height:360px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.hero{padding:30px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(var(--v),.35),transparent 70%);pointer-events:none}
.hero h2{font-size:34px;margin-bottom:10px}
.cmd{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:17px;font-weight:700;margin-bottom:6px}
.cmd code{font-size:18px;padding:8px 14px;border:1px dashed rgba(var(--v),.6)}
.sub{color:var(--dim);font-size:13px;line-height:1.5}
.meter{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.meter b{font-family:'Bricolage Grotesque';font-size:76px;line-height:1;background:linear-gradient(100deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.meter span{color:var(--dim);font-weight:700}
.pbar{height:10px;border-radius:10px;background:rgba(255,255,255,.07);overflow:hidden}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7c5cff,#e05fb8);box-shadow:0 0 18px rgba(var(--v),.9);transition:width .4s}
.modes{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.mode{display:flex;align-items:center;gap:10px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:14px;padding:9px 16px;font-weight:800;font-size:14px;transition:.2s;white-space:nowrap}
.mode small{display:block;font-size:10px;color:var(--dim);font-weight:600}
.mode:hover{transform:translateY(-2px);border-color:rgba(var(--v),.5)}
.mode.on{background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(224,95,184,.22));border-color:rgba(var(--v),.9);box-shadow:0 0 28px -6px rgba(var(--v),.9)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;align-items:center}
#go{font-size:17px;padding:16px 34px;animation:beat 2.2s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 8px 50px -2px rgba(124,92,255,1),0 0 0 8px rgba(124,92,255,.12)}}
.testl{display:flex;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid var(--hair)}.testl input:first-child{max-width:130px}
#side{padding:18px;display:flex;flex-direction:column;max-height:calc(100vh - 110px);position:sticky;top:20px}
@media(max-width:1000px){#side{position:static;max-height:520px}}
#side h2{font-size:18px;display:flex;justify-content:space-between;align-items:center}
#cnt2{background:rgba(var(--v),.25);border-radius:100px;padding:2px 12px;font-size:15px}
#plist{overflow:auto;display:flex;flex-direction:column;gap:7px;margin-top:12px;flex:1;min-height:120px}
.p{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:12px;padding:6px 10px 6px 6px;font-size:13px;font-weight:700;animation:in .35s;transition:.2s}
.p:hover{border-color:rgba(var(--v),.6);background:rgba(var(--v),.1)}
@keyframes in{from{opacity:0;transform:translateX(14px)}}
.p img{width:64px;height:36px;border-radius:7px;object-fit:cover;flex-shrink:0}
.p div{flex:1;min-width:0}.p div b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}.p div small{color:var(--dim);font-weight:600;font-size:11px}
.p button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px}.p button:hover{color:#ff6b8a}
.p.out{opacity:.35;filter:grayscale(1)}.p.champ{border-color:#ffd84a;box-shadow:0 0 20px -4px #ffd84a}
.ph{width:64px;height:36px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;background:repeating-linear-gradient(135deg,rgba(var(--v),.25) 0 8px,rgba(var(--v),.1) 8px 16px);border:1px dashed rgba(var(--v),.5);font-size:15px}
.ph.big{width:100%;height:100%;border-radius:0;font-size:46px;border:0}
.p.hid{cursor:pointer}
.empty{color:var(--dim);font-size:13px;line-height:1.5;padding:10px 4px}
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.bhead h2{font-size:26px}
.stage{padding:22px;position:relative}
.duel{display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr);gap:22px;align-items:stretch}
@media(max-width:900px){.duel{grid-template-columns:1fr}}
.stage{padding:26px}
.side2{--c:var(--v);border:1px solid rgba(var(--c),.55);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:11px;background:radial-gradient(circle at 50% 0%,rgba(var(--c),.28),rgba(var(--c),.04) 65%),linear-gradient(180deg,#140e2b,#0a0718);box-shadow:inset 0 0 30px -8px rgba(var(--c),.6)}
.side2.b{--c:var(--pk)}
.pl{aspect-ratio:16/9;border-radius:12px;overflow:hidden;position:relative;background:#000;cursor:pointer;border:1px solid rgba(var(--c),.4)}
.pl img,.pl iframe{width:100%;height:100%;border:0;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,3,14,.45);transition:.2s}
.pl:hover .play{background:rgba(5,3,14,.2)}
.play i{width:62px;height:62px;border-radius:50%;background:rgb(var(--c));display:grid;place-items:center;box-shadow:0 0 30px rgba(var(--c),.9);font-style:normal;font-size:24px;padding-left:4px}
.tt{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.by{font-size:12px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;gap:8px}.by a{color:var(--soft);text-decoration:none}
.vote{display:flex;align-items:center;gap:10px}
.vote .pbar{flex:1;height:14px}.vote .pbar i{background:rgb(var(--c));box-shadow:0 0 14px rgba(var(--c),.9)}
.vote b{font-family:'JetBrains Mono';font-size:20px;min-width:30px;text-align:right}
.vcmd{font-size:11px;color:var(--dim)}
.volrow{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.3);border:1px solid rgba(var(--c),.4);border-radius:12px;padding:8px 14px}
.volrow .mute{background:none;border:0;cursor:pointer;font-size:22px;line-height:1;padding:2px 4px;min-width:30px}
.volrow input[type=range]{-webkit-appearance:none;appearance:none;height:10px;padding:0;border:0;border-radius:10px;background:linear-gradient(90deg,rgb(var(--c)) var(--p,70%),rgba(255,255,255,.14) var(--p,70%));cursor:pointer;box-shadow:none}
.volrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid rgb(var(--c));box-shadow:0 0 12px rgba(var(--c),.9)}
.volrow input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid rgb(var(--c))}
.volrow output{font-family:'JetBrains Mono';font-size:12px;min-width:40px;text-align:right;color:var(--dim)}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.vs{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;color:var(--soft);text-shadow:0 0 24px rgb(var(--v))}
.ring{--p:100;width:96px;height:96px;border-radius:50%;background:conic-gradient(rgb(var(--v)) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;box-shadow:0 0 40px -8px rgba(var(--v),.8);position:relative}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--void)}
.ring b{position:relative;font-family:'JetBrains Mono';font-size:28px}
.mid .btn{padding:11px 14px;font-size:13px;width:100%}
.brk{margin-top:20px;padding:18px}.brk h3{font-size:18px;margin-bottom:12px}
.bracket{display:flex;gap:28px;overflow-x:auto;padding:4px 2px 10px}
.col{display:flex;flex-direction:column;justify-content:space-around;gap:10px;min-width:210px}
.col h4{font-size:12px;color:var(--soft);text-align:center;font-weight:800;letter-spacing:.5px}
.m{position:relative;background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:12px;font-size:12px;font-weight:700}
.m::after{content:"";position:absolute;right:-29px;top:50%;width:28px;height:1px;background:rgba(var(--v),.4)}
.col:last-child .m::after{display:none}
.m div{padding:7px 10px;display:flex;justify-content:space-between;gap:8px}.m div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.m div+div{border-top:1px solid var(--hair)}
.m div:first-child{border-radius:11px 11px 0 0}.m div:last-child{border-radius:0 0 11px 11px}
.m .w{background:linear-gradient(90deg,rgba(var(--v),.45),rgba(var(--pk),.2))}.m .l{opacity:.4}.m .e{color:var(--dim)}
.m.cur{border-color:rgba(var(--v),.95);box-shadow:0 0 24px -2px rgba(var(--v),.9)}
.m i{font-style:normal;font-family:'JetBrains Mono';color:var(--soft)}
#modal{position:fixed;inset:0;background:rgba(5,3,14,.84);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;overflow:hidden}
#modal.on{display:flex}
#mbox{width:min(560px,100%);padding:36px;text-align:center;border-radius:28px;border-color:rgba(var(--pk),.7);box-shadow:0 0 90px -10px rgba(var(--pk),.9);animation:pop .5s cubic-bezier(.2,1.4,.4,1);position:relative;z-index:2}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#mbox small{color:var(--soft);letter-spacing:3px;font-weight:800;font-size:12px}
#mbox img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin:18px 0 16px;border:3px solid rgb(var(--pk));box-shadow:0 0 60px rgba(var(--pk),.7)}
#mbox h2{font-size:30px;margin-bottom:8px;line-height:1.15}#mbox p{color:var(--dim);margin-bottom:22px;font-size:14px}
#mbox .row2{justify-content:center;flex-wrap:wrap;margin-top:0}
.cf{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;z-index:1}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
#toasts{position:fixed;left:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none}
.ts{background:linear-gradient(155deg,var(--g1),var(--g2));border:1px solid rgba(var(--v),.5);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;animation:in .35s;max-width:340px;box-shadow:0 10px 40px -10px #000}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="bg"><i></i><i></i><i></i><span id="sp"></span></div>

<div id="start">
 <div class="glass box">
  <div class="logo"><img class="lg" alt="Логотип"></div>
  <h1 class="grad">Битва треков</h1>
  <p>Зрители кидают ссылки на YouTube командой в чат, а треки сражаются по сетке до финала.</p>
  <div class="tw"><span>twitch.tv/</span><input id="nick" placeholder="твой_ник" autocomplete="off" spellcheck="false" autofocus></div>
  <label>Команда для предложения трека</label>
  <input id="kw" value="!сонг" autocomplete="off">
  <div class="row2"><button class="btn" id="conn" style="flex:1">Подключиться</button><button class="btn ghost" id="demo">Демо</button></div>
  <div id="st"></div>
 </div>
</div>

<div id="app">
 <header>
  <div style="display:flex;align-items:center;gap:14px"><button class="btn ghost" id="exit">← Назад</button><img class="lg hl" alt=""><h1 class="grad">Битва треков</h1></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><div class="chip"><i id="dot"></i><span id="who">не подключено</span></div><div class="chip" id="cmdchip"></div></div>
 </header>
 <div class="grid">
  <div id="main"></div>
  <div class="glass" id="side"><h2><span id="sidet">Треки</span><span id="cnt2">0</span></h2><div id="plist"></div></div>
 </div>
</div>

<div id="modal"><div class="glass" id="mbox"></div></div>

{const f=document.createElement('link');f.rel='icon';f.href=LOGO;document.head.appendChild(f)}
const S={tracks:[],pool:[],phase:'start',size:8,dur:45,rounds:[],r:0,mi:0,votes:new Map(),play:{a:0,b:0},open:true,kw:'!сонг',nick:'',ws:null,t:null,tend:0,champ:null,demo:false,hide:1,seq:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yid=u=>{const m=(u||'').match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/|live\/)([\w-]{11})/);return m?m[1]:null};
const thumb=(id,q='mqdefault')=>`https://img.youtube.com/vi/${id}/${q}.jpg`;
const ls={get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const shown=t=>!S.hide||t.rev;
const tn=t=>shown(t)?t.title:'🔒 Скрытый трек #'+t.n;
const ph=cls=>`<div class="ph ${cls||''}">🔒</div>`;
/* ---------- громкость плееров ---------- */
const VOL={a:+ls.get('sb_va',70),b:+ls.get('sb_vb',70),ma:0,mb:0};
function yt(f,func,args){try{f.contentWindow.postMessage(JSON.stringify({event:'command',func,args:args||[]}),'*')}catch(e){}}
function applyVol(k){const f=document.querySelector('.side2.'+k+' iframe');if(!f)return;yt(f,'setVolume',[VOL[k]]);yt(f,(VOL['m'+k]||!VOL[k])?'mute':'unMute')}
function ytInit(f){try{f.contentWindow.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'*')}catch(e){}[300,900,2000,3500].forEach(ms=>setTimeout(()=>applyVol(f.dataset.k),ms))}
const vIcon=k=>(VOL['m'+k]||!VOL[k])?'🔇':VOL[k]<40?'🔉':'🔊';
const volrow=k=>`<div class="volrow"><button class="mute" data-act="mute" data-v="${k}" title="Вкл/выкл звук">${vIcon(k)}</button><input type="range" min="0" max="100" value="${VOL[k]}" data-vol="${k}" style="--p:${VOL[k]}%" aria-label="Громкость"><output>${VOL[k]}%</output></div>`;
function syncVolUI(k){const r=document.querySelector('.side2.'+k+' .volrow');if(!r)return;r.querySelector('.mute').textContent=vIcon(k);const i=r.querySelector('input');i.value=VOL[k];i.style.setProperty('--p',VOL[k]+'%');r.querySelector('output').textContent=VOL[k]+'%'}
document.addEventListener('input',e=>{const i=e.target.closest&&e.target.closest('[data-vol]');if(!i)return;const k=i.dataset.vol;VOL[k]=+i.value;if(VOL[k]>0)VOL['m'+k]=0;ls.set('sb_v'+k,VOL[k]);syncVolUI(k);applyVol(k)});
/* перерисовка без перезагрузки играющих плееров */
function paintBattle(M,html){
  const tpl=document.createElement('div');tpl.innerHTML=html;const keep={};
  ['a','b'].forEach(k=>{const o=M.querySelector('.side2.'+k+' iframe'),n=tpl.querySelector('.side2.'+k+' iframe');if(o&&n&&o.dataset.vid===n.dataset.vid)keep[k]=1});
  if((!keep.a&&!keep.b)||!M.querySelector('.duel')){M.innerHTML=html;return}
  ['.bhead','.mid','.brk'].forEach(sel=>{const o=M.querySelector(sel),n=tpl.querySelector(sel);if(o&&n)o.replaceWith(n)});
  ['a','b'].forEach(k=>{const o=M.querySelector('.side2.'+k),n=tpl.querySelector('.side2.'+k);if(!o||!n)return;
    if(!keep[k]){o.replaceWith(n);return}
    const nc=[...n.children];[...o.children].forEach((c,i)=>{if(!c.classList.contains('pl')&&!c.classList.contains('volrow')&&nc[i])c.replaceWith(nc[i])})});
}
function toast(t){const e=document.createElement('div');e.className='ts';e.innerHTML=t;g('toasts').appendChild(e);setTimeout(()=>e.remove(),4200);if(g('toasts').children.length>4)g('toasts').firstChild.remove()}
g('sp').innerHTML=Array.from({length:22},()=>{const s=1+Math.random()*3;return `<b style="left:${Math.random()*100}%;width:${s}px;height:${s}px;animation-duration:${9+Math.random()*12}s;animation-delay:-${Math.random()*20}s"></b>`}).join('');

/* ---------- треки ---------- */
async function getTitle(t){try{const j=await(await fetch('https://noembed.com/embed?url=https://youtu.be/'+t.id)).json();if(j.title){t.title=j.title;renderSide();if(S.phase!=='collect')renderMain()}}catch(e){}}
function addTrack(id,user,quiet){
  if(S.phase!=='collect'||!S.open)return false;
  if(S.tracks.some(t=>t.id===id))return false;
  S.tracks=S.tracks.filter(t=>t.user!==user);
  const t={id,user,title:'Загрузка…',out:false,rev:false,n:++S.seq};S.tracks.push(t);getTitle(t);
  renderSide();updCount();
  if(!quiet)toast(`🎵 <b>${esc(user)}</b> предложил трек`);
  return true;
}
function onChat(u,msg){
  const kw=S.kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const m=msg.match(new RegExp('^(?:'+kw+'|!song|!sg)\\s+(\\S+)','i'));
  if(m){const id=yid(m[1]);if(id)addTrack(id,u);return}
  if(S.phase==='battle'&&/^!?[12]$/.test(msg)){S.votes.set(u,+msg.replace('!',''));updVotes()}
}
/* ---------- twitch ---------- */
function connect(n){
  S.nick=n;S.demo=false;ls.set('sb_nick',n);ls.set('sb_kw',S.kw);
  openApp();setStatus('connecting');
  const open=()=>{
    const ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');S.ws=ws;
    ws.onopen=()=>{ws.send('PASS SCHMOOPIIE');ws.send('NICK justinfan'+Math.floor(Math.random()*99999));ws.send('JOIN #'+n)};
    ws.onmessage=e=>e.data.split('\r\n').forEach(l=>{
      if(l.startsWith('PING'))return ws.send('PONG :tmi.twitch.tv');
      if(l.includes(' JOIN #'))setStatus('live');
      const m=l.match(/^:(\w+)!\S+ PRIVMSG #\w+ :(.*)$/);if(m)onChat(m[1],m[2].trim());
    });
    ws.onclose=()=>{if(S.ws===ws&&S.nick===n&&!S.demo){setStatus('off');setTimeout(()=>{if(S.ws===ws&&S.nick===n&&!S.demo)open()},3000)}};
  };open();
}
function setStatus(s){
  g('dot').className=s==='live'?'live':s==='demo'?'demo':'';
  g('who').textContent=s==='live'?'twitch.tv/'+S.nick:s==='demo'?'демо-режим':s==='connecting'?'подключаюсь…':'переподключение…';
  g('cmdchip').innerHTML=`<code>${esc(S.kw)} ссылка</code>`;
}
function openApp(){g('start').style.display='none';g('app').style.display='block';S.phase='collect';S.tracks=[];S.pool=[];renderAll();window.scrollTo(0,0)}
g('conn').onclick=()=>{
  const n=g('nick').value.trim().replace(/^[@#]/,'').toLowerCase();
  if(!/^[a-z0-9_]{3,25}$/.test(n)){g('st').textContent='введи ник стримера латиницей';return}
  S.kw=g('kw').value.trim()||'!сонг';connect(n);
};
g('nick').onkeydown=g('kw').onkeydown=e=>{if(e.key==='Enter')g('conn').click()};
g('demo').onclick=()=>{S.kw=g('kw').value.trim()||'!сонг';S.demo=true;S.nick='';openApp();setStatus('demo')};
g('exit').onclick=()=>{stopTimer();if(S.ws){const w=S.ws;S.ws=null;w.close()}S.nick='';S.phase='start';g('modal').classList.remove('on');g('app').style.display='none';g('start').style.display='flex'};
g('nick').value=ls.get('sb_nick','');g('kw').value=ls.get('sb_kw','!сонг');S.size=+ls.get('sb_size',8);S.dur=+ls.get('sb_dur',45);S.hide=+ls.get('sb_hide',1);

/* ---------- сетка ---------- */
const nr=n=>{let r=0,p=1;while(p<n){p*=2;r++}return r};
function rname(i){const left=S.rounds.length-i;return left===1?'Финал':left===2?'Полуфинал':left===3?'Четвертьфинал':'1/'+(1<<(left-1))+' финала'}
function place(r,i,t){if(r+1<S.rounds.length)S.rounds[r+1][i>>1][i%2?'b':'a']=t}
function advance(){while(S.r<S.rounds.length){const k=S.rounds[S.r].findIndex(m=>!m.w);if(k>=0){S.mi=k;return true}S.r++}return false}
function startBattle(){
  let pool=[...S.tracks].sort(()=>Math.random()-.5);
  const n=S.size?Math.min(S.size,pool.length):pool.length;if(n<2)return;
  pool=pool.slice(0,n);pool.forEach(t=>{t.out=false;t.champ=false});S.pool=pool;
  let P=1;while(P<n)P*=2;const byes=P-n;S.rounds=[];
  for(let k=P;k>=2;k/=2)S.rounds.push(Array.from({length:k/2},()=>({a:null,b:null,w:null})));
  let x=0;S.rounds[0].forEach((m,i)=>{if(i<byes){m.a=pool[x++];m.w=m.a;m.bye=true;place(0,i,m.a)}else{m.a=pool[x++];m.b=pool[x++]}});
  S.r=0;S.mi=0;S.votes.clear();S.play={a:0,b:0};S.phase='battle';advance();renderAll();
}
const cur=()=>S.rounds[S.r][S.mi];
const counts=()=>{let a=0,b=0;S.votes.forEach(v=>v===1?a++:b++);return[a,b]};
function pick(side,sa,sb){
  const m=cur();m.a.rev=true;if(m.b)m.b.rev=true;m.w=m[side];const l=side==='a'?m.b:m.a;if(l)l.out=true;m.sa=sa;m.sb=sb;
  place(S.r,S.mi,m.w);stopTimer();S.votes.clear();S.play={a:0,b:0};
  toast(`🏆 <b>${esc(m.w.title)}</b> проходит дальше${sa+sb?` (${sa}:${sb})`:''}`);
  if(!advance()){S.champ=m.w;m.w.champ=true;S.phase='done';S.pool.forEach(t=>t.rev=true);renderAll();showChamp()}else renderAll();
}
function startTimer(){
  S.votes.clear();updVotes();S.tend=Date.now()+S.dur*1000;clearInterval(S.t);S.t=setInterval(tick,200);tick();
  const b=g('tstart');if(b)b.disabled=true;
}
function stopTimer(){clearInterval(S.t);S.t=null;S.tend=0}
function tick(){
  const left=Math.max(0,S.tend-Date.now()),ring=g('ring'),tn=g('tnum');
  if(ring){ring.style.setProperty('--p',left/(S.dur*1000)*100);tn.textContent=Math.ceil(left/1000)}
  if(left<=0){const[a,b]=counts();const s=a>b?'a':b>a?'b':(Math.random()<.5?'a':'b');if(a===b)toast('🎲 Ничья, выбор случайный');pick(s,a,b)}
}
function updVotes(){
  if(S.phase!=='battle')return;const[a,b]=counts(),t=a+b||1;
  [['a',a],['b',b]].forEach(([k,n])=>{const f=g('vf'+k),c=g('vc'+k);if(f){f.style.width=Math.round(n/t*100)+'%';c.textContent=n}});
}

/* ---------- рендер ---------- */
function renderAll(){renderMain();renderSide()}
function updCount(){
  if(S.phase!=='collect')return;const n=S.tracks.length,tgt=S.size||Math.max(n,2);
  const c=g('cnt'),pb=g('pb'),go=g('go');if(!c)return;
  c.textContent=n;pb.style.width=Math.min(100,n/tgt*100)+'%';
  const use=S.size?Math.min(S.size,n):n,r=nr(use);go.disabled=n<2;
  go.textContent=n<2?'Нужно минимум 2 трека':`⚔️ Начать · ${use} треков, ${r} ${r===1?'раунд':r<5?'раунда':'раундов'}`;
  g('cnt2').textContent=n;
}
function chips(arr,cur,act){return arr.map(([v,l,s])=>`<div class="mode ${cur===v?'on':''}" data-act="${act}" data-v="${v}"><div>${l}${s?`<small>${s}</small>`:''}</div></div>`).join('')}
function renderMain(){
  const M=g('main');document.querySelector('.grid').classList.toggle('wide',S.phase==='battle');
  if(S.phase==='collect'){
    M.innerHTML=`<div class="glass hero">
     <h2 class="grad">Приём треков</h2>
     <div class="cmd">Пишите в чат: <code>${esc(S.kw)} https://youtu.be/…</code></div>
     <div class="sub">Один зритель — один трек. Новая ссылка заменяет старую, повторы отсеиваются.</div>
     <div class="meter"><b id="cnt">0</b><span>треков в пуле</span></div><div class="pbar"><i id="pb"></i></div>
     <label>Сколько треков в сетке</label>
     <div class="modes">${chips([[4,'4','2 раунда'],[8,'8','3 раунда'],[16,'16','4 раунда'],[32,'32','5 раундов'],[0,'Все','сколько набрали']],S.size,'size')}</div>
     <label>Время на голосование</label>
     <div class="modes">${chips([[30,'30 с'],[45,'45 с'],[60,'60 с'],[90,'90 с'],[0,'Вручную','выбираю сам']],S.dur,'dur')}</div>
     <label>Названия треков</label>
     <div class="modes">${chips([[1,'🔒 Скрыты','стример не знает, что закинули'],[0,'Показаны']],S.hide,'hide')}</div>
     <div class="acts"><button class="btn" id="go" data-act="start">⚔️ Начать</button>
      <button class="btn ghost" data-act="open">${S.open?'⏸ Закрыть приём':'▶ Открыть приём'}</button>
      <button class="btn ghost" data-act="demot">🧪 Демо-треки</button>
      <button class="btn ghost" data-act="clear">Очистить</button></div>
     <div class="testl"><input id="tn" placeholder="ник" value="тестер"><input id="tm" placeholder="тест чата: ${esc(S.kw)} ссылка"><button class="btn ghost" data-act="test">Отправить</button></div>
    </div>`;
    updCount();
  }else if(S.phase==='battle'){
    const m=cur(),R=S.rounds[S.r];
    const sd=(k,t)=>`<div class="side2 ${k}"><div class="pl" data-act="play" data-v="${k}">${S.play[k]?`<iframe allow="autoplay;encrypted-media;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" data-vid="${t.id}" data-k="${k}" onload="ytInit(this)" src="https://www.youtube-nocookie.com/embed/${t.id}?autoplay=1&rel=0&enablejsapi=1"></iframe>`:`${shown(t)?`<img src="${thumb(t.id)}" alt="">`:ph('big')}<div class="play"><i>▶</i></div>`}</div>
      ${volrow(k)}<div class="tt">${esc(tn(t))}</div><div class="by"><span>от ${esc(t.user)}</span>${shown(t)?`<a href="https://youtu.be/${t.id}" target="_blank" rel="noopener">YouTube ↗</a>`:`<a href="#" data-act="rev" data-v="${k}">👁 показать</a>`}</div>
      <div class="vote"><div class="pbar"><i id="vf${k}" style="width:0"></i></div><b id="vc${k}">0</b></div><div class="vcmd">голос в чат: <code>${k==='a'?1:2}</code></div>
      <button class="btn ${k==='b'?'pk':''}" data-act="pick" data-v="${k}">🏆 Победил этот</button></div>`;
    const html=`<div class="glass stage"><div class="bhead"><h2 class="grad">${rname(S.r)}</h2><div class="chip">матч ${S.mi+1} из ${R.length}</div></div>
      <div class="duel">${sd('a',m.a)}<div class="mid"><div class="vs">VS</div>
       ${S.dur?`<div class="ring" id="ring"><b id="tnum">${S.dur}</b></div><button class="btn" id="tstart" data-act="tstart">▶ Старт голосования</button>`:`<div class="sub" style="text-align:center">Победителя выбираешь ты</div>`}
       <button class="btn ghost" data-act="bots">🤖 Боты голосуют</button></div>${sd('b',m.b)}</div></div>
      <div class="glass brk"><h3>Сетка</h3>${bracket()}</div>`;
    paintBattle(M,html);updVotes();
  }else if(S.phase==='done'){
    M.innerHTML=`<div class="glass hero" style="text-align:center"><div style="font-size:54px">👑</div><h2 class="grad">${esc(S.champ.title)}</h2>
      <div class="sub">Чемпион от ${esc(S.champ.user)}</div>
      <div class="acts" style="justify-content:center"><button class="btn" data-act="champ">Показать победителя</button><button class="btn ghost" data-act="again">Новый баттл</button></div></div>
      <div class="glass brk"><h3>Итоговая сетка</h3>${bracket()}</div>`;
  }
}
function bracket(){
  return '<div class="bracket">'+S.rounds.map((R,i)=>`<div class="col"><h4>${rname(i)}</h4>${R.map((m,j)=>{
    const c=S.phase==='battle'&&i===S.r&&j===S.mi?' cur':'';
    const row=(t,k)=>`<div class="${m.w?(m.w===t?'w':'l'):''}${t?'':' e'}"><span>${t?esc(tn(t)):'—'}</span>${m.w&&!m.bye&&t?`<i>${k==='a'?m.sa:m.sb}</i>`:''}</div>`;
    return `<div class="m${c}">${row(m.a,'a')}${m.bye?'<div class="e"><span>проход без боя</span></div>':row(m.b,'b')}</div>`}).join('')}</div>`).join('')+'</div>';
}
function renderSide(){
  const list=S.phase==='collect'?S.tracks:S.pool;
  g('sidet').textContent=S.phase==='collect'?'Треки':'Участники';g('cnt2').textContent=list.length;
  g('plist').innerHTML=list.length?list.map((t,i)=>`<div class="p ${t.out?'out':''} ${t.champ?'champ':''} ${S.hide&&!t.rev?'hid':''}" data-rev="${i}">${shown(t)?`<img src="${thumb(t.id)}" alt="">`:ph()}<div><b>${esc(tn(t))}</b><small>${esc(t.user)}${shown(t)?` · <a href="https://youtu.be/${t.id}" target="_blank" rel="noopener" style="color:var(--soft)">смотреть ↗</a>`:S.hide?' · нажми, чтобы показать':''}</small></div>${S.phase==='collect'?`<button data-del="${i}">✕</button>`:''}</div>`).join(''):`<div class="empty">Пока пусто. Как только зрители напишут <code>${esc(S.kw)} ссылка</code>, треки появятся здесь.</div>`;
}
g('plist').onclick=e=>{if(e.target.closest('a'))return;const b=e.target.closest('[data-del]');if(b){const l=S.phase==='collect'?S.tracks:S.pool;S.tracks.splice(+b.dataset.del,1);renderSide();updCount();return}
 const q=e.target.closest('[data-rev]');if(q&&S.hide){const l=S.phase==='collect'?S.tracks:S.pool,t=l[+q.dataset.rev];if(t){t.rev=!t.rev;renderSide();if(S.phase!=='collect')renderMain()}}};
/* ---------- победитель ---------- */
function showChamp(){
  const t=S.champ;
  g('mbox').innerHTML=`<small>ТРЕК-ЧЕМПИОН</small><img src="${thumb(t.id,'hqdefault')}" alt=""><h2 class="grad">${esc(t.title)}</h2><p>Предложил ${esc(t.user)}</p>
   <div class="row2"><a class="btn" style="text-decoration:none" href="https://youtu.be/${t.id}" target="_blank" rel="noopener">Слушать</a><button class="btn ghost" data-act="again">Новый баттл</button><button class="btn ghost" data-act="close">Закрыть</button></div>`;
  g('modal').classList.add('on');
  const cols=['#7c5cff','#e05fb8','#3fb8c9','#fff','#ffd84a'];
  g('modal').querySelectorAll('.cf').forEach(e=>e.remove());
  for(let i=0;i<70;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}%;background:${cols[i%5]};animation-duration:${2.5+Math.random()*3}s;animation-delay:${Math.random()*1.2}s`;g('modal').appendChild(c)}
}
/* ---------- действия ---------- */
const DEMO=['dQw4w9WgXcQ','9bZkp7q19f0','kJQP7kiw5Fk','JGwWNGJdvx8','RgKAFK5djSk','fJ9rUzIMcZQ','OPf0YbXqDm0','YQHsXMglC9A','hT_nvWreIhg','60ItHLz5WEA','CevxZvSJLk8','e-ORhEE9VVg','09R8_2nJtjg','kXYiU_JCYtU','lp-EO5I60KA','2Vv-BfVoq4g'];
function act(a,v){
  if(a==='size'){S.size=+v;ls.set('sb_size',v);renderMain()}
  else if(a==='dur'){S.dur=+v;ls.set('sb_dur',v);renderMain()}
  else if(a==='start')startBattle();
  else if(a==='open'){S.open=!S.open;renderMain()}
  else if(a==='demot'){DEMO.forEach((id,i)=>addTrack(id,'зритель'+(i+1),true))}
  else if(a==='clear'){S.tracks=[];renderSide();updCount()}
  else if(a==='test'){const u=g('tn').value.trim()||'тестер',m=g('tm').value.trim();if(m){onChat(u,m);g('tm').value=''}}
  else if(a==='hide'){S.hide=+v;ls.set('sb_hide',v);renderAll()}
  else if(a==='rev'){const m=cur();m[v].rev=true;renderMain();renderSide()}
  else if(a==='play'){const m=cur();m[v].rev=true;S.play[v]=1;renderMain();renderSide()}
  else if(a==='pick'){const[x,y]=counts();pick(v,x,y)}
  else if(a==='tstart')startTimer();
  else if(a==='bots'){const n=8+Math.floor(Math.random()*10);for(let i=0;i<n;i++)S.votes.set('бот'+Math.floor(Math.random()*60),Math.random()<.5?1:2);updVotes()}
  else if(a==='again'){stopTimer();g('modal').classList.remove('on');S.phase='collect';S.pool=[];S.tracks=S.tracks.map(t=>({...t,out:false,champ:false,rev:false}));renderAll()}
  else if(a==='mute'){VOL['m'+v]=(VOL['m'+v]||!VOL[v])?0:1;if(!VOL[v]&&!VOL['m'+v])VOL[v]=70,ls.set('sb_v'+v,70);syncVolUI(v);applyVol(v)}
  else if(a==='champ')showChamp();
  else if(a==='close')g('modal').classList.remove('on');
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){e.preventDefault();act(el.dataset.act,el.dataset.v)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='tm'||e.target.id==='tn'))act('test')});
</script></body></html>
